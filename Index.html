<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基督教詩歌廣東話歌詞庫</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family: "Noto Serif TC", serif;
  line-height: 2;
  max-width: 700px;
  margin: 0 auto;
  padding: 30px 20px;
  /* 羊皮紙溫和米黃背景 */
  background: #f6efe6;
  color: #222;
  transition: 0.3s;
}
.dark{
  background:#221f1d;
  color:#ddd;
}
header{
  margin-bottom:40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
}
.logo-title{
  display:flex;
  align-items:center;
  gap:12px;
}
.logo{
  width:56px;
  height:56px;
  border-radius:50%;
  object-fit:cover;
}
h1{
  font-size:26px;
  font-weight:normal;
}
button{
  border:1px solid #999;
  background:transparent;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}
.poem{
  margin-bottom:50px;
  white-space:pre-line;
}
.poem h2{
  font-size:20px;
  margin-bottom:8px;
  font-weight:normal;
}
.author{
  font-size:14px;
  opacity:0.7;
  margin-bottom:16px;
}
footer{
  margin-top:60px;
  font-size:13px;
  opacity:0.6;
}
</style>
</head>
<body>
<header>
  <div class="logo-title">
    <img class="logo" src="logo1.png" alt="基督教詩歌歌詞庫 Logo">
    <h1>基督教詩歌廣東話歌詞庫</h1>
  </div>
  <button id="toggle">切換深色模式</button>
</header>

<!-- 每一首詩/歌詞就複製一塊 .poem -->
<div class="poem">
<h2>奇異恩典</h2>
<div class="author">約翰牛頓</div>
奇異恩典，何等甘甜
我罪已得赦免
前我失喪，今被尋回
瞎眼今得看見
</div>

<div class="poem">
<h2>另一首詩歌</h2>
<div class="author">作者</div>
這裡放歌詞內容

一行一行寫
換行直接 Enter
</div>

<footer>
基督教詩歌廣東話歌詞庫｜版權歸各作者所有，僅供個人參考
</footer>

<script>
const btn = document.getElementById('toggle');
btn.onclick = ()=>{
  document.body.classList.toggle('dark');
}
</script>
</body>
</html>
